<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />

<html xmlns="http://www.w3.org/1999/xhtml">
<head id="Head1" runat="server">
    <title></title>

    <style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>

    <script type="text/javascript" src="js/allAHandler.js"></script>
    <script type="text/javascript" src="js/layer/layer/layer.js"></script>

    <script language="javascript" type="text/javascript">

        window.onload = function () {

            this.document.title = window.frames["topFrame"].document.title;
        }

    </script>

</head>
<body>

    <iframe id="topFrame" name="topFrame" src='TakeTopAPPMain.aspx' style="height: 100%; width: 100%; border-width: 0px;" scrolling="yes" marginwidth="0" marginheight="0"></iframe>


</body>
<script type="text/javascript" language="javascript">
    var cssDirectory = '<%=Session["CssDirectory"] %>';
    var oLink = document.getElementById('mainCss');
    if (oLink) { oLink.href = 'css/' + cssDirectory + '/' + 'bluelightmain.css'; }

    // ── 移动端 iframe 内整页滚动兜底（微信/WKWebView）──
    // 每次顶层 iframe 加载（含内部跳转到功能页）时，强制其内部文档 html/body 允许滚动
    function fixFrameScroll() {
        try {
            var f = document.getElementById('topFrame');
            if (!f || !f.contentDocument) return;
            var doc = f.contentDocument;
            var html = doc.documentElement;
            var body = doc.body;
            if (html) {
                html.style.height = '100%';
                html.style.overflow = 'auto';
                html.style.overflowX = 'auto';
                html.style.overflowY = 'auto';
                html.style.position = 'relative';
            }
            if (body) {
                body.style.height = 'auto';
                body.style.minHeight = '100%';
                body.style.overflow = 'visible';
                body.style.overflowY = 'visible';
                body.style.position = 'relative';
            }
        } catch (e) { /* 忽略，不影响功能 */ }
    }
    var frameEl = document.getElementById('topFrame');
    if (frameEl) {
        frameEl.addEventListener('load', function () { setTimeout(fixFrameScroll, 120); });
    }
    window.addEventListener('load', function () { setTimeout(fixFrameScroll, 120); });
</script>
</html>
